name: pipr

on:
  pull_request:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/_github_home/.bun/install/cache
          key: pipr-bun-${{ hashFiles('.pipr/bun.lock') }}
      - uses: somus/pipr@v0.4.0
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPR_R2_MEMORY_BUCKET: ${{ secrets.PIPR_R2_MEMORY_BUCKET }}
          PIPR_R2_MEMORY_ENDPOINT: ${{ secrets.PIPR_R2_MEMORY_ENDPOINT }}
          PIPR_R2_MEMORY_ACCESS_KEY_ID: ${{ secrets.PIPR_R2_MEMORY_ACCESS_KEY_ID }}
          PIPR_R2_MEMORY_SECRET_ACCESS_KEY: ${{ secrets.PIPR_R2_MEMORY_SECRET_ACCESS_KEY }}
