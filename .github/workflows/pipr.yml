name: pipr

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/_github_home/.bun/install/cache
          key: pipr-bun-${{ hashFiles('.pipr/bun.lock') }}
      - name: Run unreleased protected observability build
        id: pipr
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          PIPR_RUN_AGE_RECIPIENTS: ${{ vars.PIPR_RUN_AGE_RECIPIENTS }}
          PIPR_IMAGE: ghcr.io/somus/pipr@sha256:e457c8a1d06b63ead09f48dcdcd33e5b4d8a0ddd65859e8136af503b37cd944a
        run: |
          touch .pipr-live-output
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$GITHUB_EVENT_PATH:/tmp/github-event.json:ro" \
            --env DEEPSEEK_API_KEY \
            --env GITHUB_ACTIONS=true \
            --env GITHUB_API_URL \
            --env GITHUB_EVENT_NAME \
            --env GITHUB_EVENT_PATH=/tmp/github-event.json \
            --env GITHUB_JOB \
            --env GITHUB_OUTPUT=/workspace/.pipr-live-output \
            --env GITHUB_REPOSITORY \
            --env GITHUB_RUN_ID \
            --env GITHUB_SERVER_URL \
            --env GITHUB_TOKEN \
            --env GITHUB_WORKSPACE=/workspace \
            --env PIPR_RUN_AGE_RECIPIENTS \
            "$PIPR_IMAGE" \
            host-run --host github --config-dir .pipr
          cat .pipr-live-output >> "$GITHUB_OUTPUT"
      - name: Upload protected Pipr run bundle
        if: always() && steps.pipr.outputs.run-bundle-path != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.pipr.outputs.run-artifact-name }}
          path: ${{ steps.pipr.outputs.run-bundle-path }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
