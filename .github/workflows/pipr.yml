name: pipr

on:
  pull_request:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: /home/runner/work/_temp/_github_home/.bun/install/cache
          key: pipr-bun-${{ hashFiles('.pipr/bun.lock') }}
      - uses: docker://ghcr.io/somus/pipr:pr-128-live-5532ba96
        with:
          args: host-run --host github --config-dir .pipr
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
